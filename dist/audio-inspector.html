<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频检测工具 - 音频效果工作站</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            margin-bottom: 16px;
            padding: 6px 14px;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .back-link:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        h1 {
            font-size: 1.5em;
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 1.05em;
            color: #38bdf8;
            font-weight: 600;
        }

        input[type="file"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 14px;
            color: #e2e8f0;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: none;
        }

        /* 规格表：MediaInfo 风格 */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92em;
        }

        .spec-table td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .spec-table td:first-child {
            color: #94a3b8;
            width: 130px;
            white-space: nowrap;
        }

        .spec-table td:last-child {
            font-family: 'Cascadia Code', Consolas, monospace;
            color: #e2e8f0;
        }

        .spec-table tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.82em;
            font-family: inherit;
        }

        .badge.ok {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .badge.warn {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #fbbf24;
        }

        .badge.bad {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            margin: 12px 0 0;
            font-size: 0.9em;
        }

        .message.ok {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #34d399;
        }

        .message.bad {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
        }

        .message.info {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #38bdf8;
        }

        /* 格式支持矩阵 */
        .format-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
        }

        .format-item {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            text-align: center;
        }

        audio {
            width: 100%;
            margin-top: 12px;
        }

        .hint {
            color: #64748b;
            font-size: 0.85em;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="back-link">← 返回主应用</a>
        <h1>🔍 音频检测工具</h1>

        <div class="card">
            <h2>选择文件</h2>
            <input type="file" id="audioFile" accept="audio/*">
            <p class="hint">选择后自动解析：文件规格、浏览器兼容性、播放测试。文件仅在本地解析，不会上传。</p>
            <div id="fileMessage"></div>
        </div>

        <div class="card" id="specCard" style="display: none;">
            <h2>文件规格</h2>
            <table class="spec-table" id="specTable"></table>
        </div>

        <div class="card" id="compatCard" style="display: none;">
            <h2>播放测试</h2>
            <div id="playResult"></div>
            <audio id="preview" controls style="display: none;"></audio>
        </div>

        <div class="card">
            <h2>当前浏览器格式支持</h2>
            <div class="format-grid" id="formatSupport"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('audioFile');
        let objectUrl = null;

        const formatBytes = (bytes) => {
            const units = ['B', 'KB', 'MB', 'GB'];
            const i = bytes === 0 ? 0 : Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 2) + ' ' + units[i];
        };

        const formatDuration = (seconds) => {
            if (!isFinite(seconds)) return '未知';
            const total = Math.round(seconds * 1000) / 1000;
            const mins = Math.floor(total / 60);
            const secs = (total % 60).toFixed(3).padStart(6, '0');
            return `${mins}:${secs}`;
        };

        // ---- 浏览器格式支持矩阵 ----
        (function renderFormatSupport() {
            const probe = new Audio();
            const formats = [
                ['MP3', 'audio/mpeg'], ['WAV', 'audio/wav'], ['OGG', 'audio/ogg'],
                ['AAC', 'audio/aac'], ['M4A', 'audio/mp4'], ['WebM', 'audio/webm'], ['FLAC', 'audio/flac']
            ];
            document.getElementById('formatSupport').innerHTML = formats.map(([name, mime]) => {
                const support = probe.canPlayType(mime);
                const cls = support === 'probably' ? 'ok' : support === 'maybe' ? 'warn' : 'bad';
                const label = support === 'probably' ? '' : support === 'maybe' ? '?' : '✕';
                return `<div class="format-item badge ${cls}">${name}${label ? ' ' + label : ''}</div>`;
            }).join('');
        })();

        // ---- 主流程 ----
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const message = document.getElementById('fileMessage');
            if (!file) return;

            message.innerHTML = '<div class="message info">解析中...</div>';
            ['specCard', 'compatCard'].forEach(id => document.getElementById(id).style.display = 'none');

            try {
                const [header, audioBuffer] = await Promise.all([
                    readHeader(file),
                    decodeFile(file)
                ]);
                renderSpec(file, header, audioBuffer);
                await testPlayback(file);
                message.innerHTML = '';
            } catch (error) {
                renderSpec(file, header, null);
                document.getElementById('specCard').style.display = 'block';
                await testPlayback(file, error);
                message.innerHTML = `<div class="message bad">解码失败：${error.message}</div>`;
            }
        });

        function readHeader(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(new Uint8Array(reader.result));
                reader.onerror = () => reject(reader.error);
                reader.readAsArrayBuffer(file.slice(0, 128));
            });
        }

        function decodeFile(file) {
            return file.arrayBuffer().then(buffer => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                return ctx.decodeAudioData(buffer).finally(() => ctx.close());
            });
        }

        // 容器/编码识别
        function detectFormat(bytes, file) {
            const ascii = (start, length) => String.fromCharCode(...bytes.slice(start, start + length));

            if (ascii(0, 4) === 'RIFF' && ascii(8, 4) === 'WAVE') {
                let codec = 'WAV', bitDepth = null;
                // 遍历 chunk 找 fmt（fmt 不一定紧跟在 12 字节后）
                let offset = 12;
                while (offset + 8 <= bytes.length) {
                    const chunkId = ascii(offset, 4);
                    const chunkSize = bytes[offset + 4] | (bytes[offset + 5] << 8) | (bytes[offset + 6] << 16) | (bytes[offset + 7] << 24);
                    if (chunkId === 'fmt ') {
                        const view = new DataView(bytes.buffer, offset + 8, Math.min(chunkSize, 40));
                        const format = view.getUint16(0, true);
                        bitDepth = view.getUint16(14, true);
                        codec = format === 1 ? 'PCM' : format === 3 ? 'IEEE Float' :
                            format === 0xFFFE ? 'WAV Extensible' : `WAV (0x${format.toString(16)})`;
                        break;
                    }
                    offset += 8 + chunkSize + (chunkSize & 1);
                }
                return { container: 'WAV', codec, bitDepth };
            }
            if (bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0) return { container: 'MP3', codec: 'MPEG Audio' };
            if (ascii(0, 4) === 'OggS') return { container: 'OGG', codec: 'Vorbis / Opus' };
            if (ascii(4, 4) === 'ftyp') {
                const brand = ascii(8, 4);
                return { container: 'MP4/M4A', codec: brand.startsWith('M4A') ? 'AAC' : `AAC (${brand})` };
            }
            if (ascii(0, 4) === 'fLaC') return { container: 'FLAC', codec: 'FLAC' };
            if (ascii(0, 4) === '\x1A\x45\xDF\xA3') return { container: 'WebM/EBML', codec: 'Opus/Vorbis' };
            const ext = file.name.split('.').pop().toUpperCase();
            return { container: ext || '未知', codec: '未知' };
        }

        function renderSpec(file, headerBytes, audioBuffer) {
            const info = detectFormat(headerBytes, file);
            const duration = audioBuffer ? audioBuffer.duration : null;
            const sampleRate = audioBuffer ? audioBuffer.sampleRate : null;
            const channels = audioBuffer ? audioBuffer.numberOfChannels : null;
            const bitrate = duration ? Math.round(file.size * 8 / duration / 1000) : null;

            const rows = [
                ['文件名', file.name],
                ['文件大小', formatBytes(file.size)],
                ['容器格式', info.container],
                ['编码', info.codec],
                ['时长', duration ? formatDuration(duration) : '—'],
                ['采样率', sampleRate ? sampleRate.toLocaleString() + ' Hz' : '—'],
                ['声道', channels ? `${channels} ch (${channels === 1 ? 'mono' : channels === 2 ? 'stereo' : 'multi'})` : '—'],
                ['位深', info.bitDepth ? `${info.bitDepth} bit` : '—'],
                ['比特率', bitrate ? `${bitrate} kbps` : '—'],
                ['MIME', file.type || '未知'],
            ];

            document.getElementById('specTable').innerHTML =
                rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
            document.getElementById('specCard').style.display = 'block';
        }

        function testPlayback(file, decodeError) {
            return new Promise((resolve) => {
                if (objectUrl) URL.revokeObjectURL(objectUrl);
                objectUrl = URL.createObjectURL(file);

                const audio = new Audio();
                const result = document.getElementById('playResult');
                const preview = document.getElementById('preview');
                const compatCard = document.getElementById('compatCard');
                compatCard.style.display = 'block';

                let settled = false;
                const finish = (ok, text, cls) => {
                    if (settled) return;
                    settled = true;
                    result.innerHTML = `<div class="message ${cls}">${ok ? '✅' : '❌'} ${text}</div>`;
                    if (ok) {
                        preview.src = objectUrl;
                        preview.style.display = 'block';
                    } else if (decodeError) {
                        result.innerHTML += `<div class="message info">建议：用 FFmpeg 重编码为标准格式，例如 16-bit PCM WAV 或 192 kbps MP3。</div>`;
                    }
                    resolve();
                };

                audio.addEventListener('loadedmetadata', () => {
                    const supported = decodeError ? '（浏览器可播放，但 Web Audio 无法解码——主应用可能无法加载）'
                        : '（浏览器与 Web Audio 均可加载）';
                    finish(true, `可播放 ${supported}`, 'ok');
                }, { once: true });

                audio.addEventListener('error', () => {
                    const code = audio.error ? audio.error.code : 0;
                    const text = {
                        1: '加载被中止', 2: '网络错误', 3: '解码失败（文件损坏或编码不受支持）', 4: '格式不受支持'
                    }[code] || `媒体错误（代码 ${code}）`;
                    finish(false, text, 'bad');
                }, { once: true });

                setTimeout(() => finish(false, '加载超时', 'bad'), 10000);
                audio.src = objectUrl;
                audio.preload = 'metadata';
            });
        }

        window.addEventListener('beforeunload', () => {
            if (objectUrl) URL.revokeObjectURL(objectUrl);
        });
    </script>
</body>

</html>
